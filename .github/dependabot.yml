version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Freshly published versions are where a compromised release shows up before it is caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The docs build pin in requirements-docs.txt. Dependabot does not regenerate the hash
  # lock: on its PR, run the command in the file's header and push the lock to the same
  # branch (the docs workflow installs from the lock and fails until then).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
